<!DOCTYPE html>
<html>
<head>
  <title>Jeddah Flood Alert System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Smart Flood Alert System</h1>
  <p>Click the button to simulate water level detection.</p>
  <button onclick="checkWaterLevel()">Simulate Water Level</button>
  <div id="status">System Normal</div>

  <h2>Flood Risk Heatmap (Simulation)</h2>
  <div class="heatmap">
  <div class="row">
    <div class="cell red"></div>
    <div class="cell red"></div>
    <div class="cell red"></div>
    <div class="cell green"></div>
    <div class="cell red"></div>
  </div>
  <div class="row">
    <div class="cell green"></div>
    <div class="cell red"></div>
    <div class="cell green"></div>
    <div class="cell red"></div>
    <div class="cell green"></div>
  </div>
  <div class="row">
    <div class="cell green"></div>
    <div class="cell red"></div>
    <div class="cell green"></div>
    <div class="cell red"></div>
    <div class="cell red"></div>
  </div>
  <div class="row">
    <div class="cell red"></div>
    <div class="cell green"></div>
    <div class="cell green"></div>
    <div class="cell green"></div>
    <div class="cell green"></div>
  </div>
  <div class="row">
    <div class="cell red"></div>
    <div class="cell green"></div>
    <div class="cell green"></div>
    <div class="cell green"></div>
    <div class="cell green"></div>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
